<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>登录 · AI 工具额度看板</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='12' fill='none' stroke='%236b8afd' stroke-width='4' stroke-dasharray='56 20' stroke-linecap='round'/%3E%3C/svg%3E">
<script>
// 首帧前定主题（与主看板同一 localStorage 键，登录过的主页风格延续）
(function () {
  let t = null;
  try { t = localStorage.getItem('aqd:theme'); } catch {}
  if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
  document.documentElement.dataset.theme = t;
})();
</script>
<style>
/* 登录页自包含（门禁前唯一可免登录加载的页面，不引用主站 JS/CSS）；token 与 style.css 同源 */
:root {
  color-scheme: dark;
  --bg: #11141d; --surface: #1a1f2e; --surface-2: #232838; --border: #2a3044; --border-strong: #3a4158;
  --text: #e8ebf4; --text-2: #b8bfd2; --muted: #7e87a0; --accent: #6b8afd; --accent-strong: #8aa6ff;
  --accent-dim: rgba(107, 138, 253, .16); --red: #e5676c; --green: #4ac882; --radius: 12px;
  --btn-bg: #3d5fe0; /* 主 CTA 底：白字在其上 AA ≥4.5（accent 原值偏亮只作描边/焦点色） */
}
:root[data-theme="light"] {
  color-scheme: light;
  --bg: #f7f8fd; --surface: #ffffff; --surface-2: #eef1f8; --border: #dfe3ef; --border-strong: #c8cede;
  --text: #1d2230; --text-2: #454d63; --muted: #646c85; --accent: #3d5fe0; --accent-strong: #2f4dc4;
  --accent-dim: rgba(61, 95, 224, .12); --red: #c03843; --green: #097949; --btn-bg: #3d5fe0;
}
* { box-sizing: border-box; }
body {
  margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
  background:
    radial-gradient(60% 40% at 50% -10%, var(--accent-dim), transparent 70%),
    var(--bg);
  font: 14px/1.5 -apple-system, "SF Pro Text", "PingFang SC", "Segoe UI", sans-serif;
  color: var(--text);
}
.card {
  width: min(360px, 92vw); background: var(--surface); border: 1px solid var(--border);
  border-radius: calc(var(--radius) + 6px); padding: 28px 26px 24px;
  box-shadow: 0 18px 50px rgba(0, 0, 0, .28);
}
.logo { width: 34px; height: 34px; border-radius: 50%; border: 4px solid var(--accent);
  border-right-color: transparent; transform: rotate(-45deg); margin-bottom: 14px; }
h1 { font-size: 17px; margin: 0 0 4px; letter-spacing: .2px; }
.sub { color: var(--muted); font-size: 12px; margin-bottom: 20px; }
label { display: block; font-size: 12px; color: var(--text-2); margin: 12px 0 5px; }
input {
  width: 100%; padding: 9px 12px; border-radius: var(--radius); border: 1px solid var(--border);
  background: var(--surface-2); color: var(--text); font-size: 14px; outline: none;
}
input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-dim); }
button {
  width: 100%; margin-top: 18px; padding: 10px; border: 0; border-radius: var(--radius);
  background: var(--btn-bg); color: #fff; font-size: 14px; font-weight: 600; cursor: pointer;
  transition: filter .15s ease, transform .05s ease;
}
button:hover { filter: brightness(1.08); }
button:active { transform: translateY(1px); }
button:disabled { opacity: .55; cursor: default; }
#err { display: none; margin-top: 14px; padding: 8px 10px; border-radius: 8px; font-size: 12.5px;
  color: var(--red); background: rgba(229, 103, 108, .12); }
#err.show { display: block; }
.foot { margin-top: 16px; font-size: 12px; color: var(--muted); }
</style>
</head>
<body>
  <main class="card">
    <div class="logo" aria-hidden="true"></div>
    <h1>AI 工具额度看板</h1>
    <div class="sub">私有部署 · 登录后访问</div>
    <form id="f" autocomplete="on">
      <label for="user">用户名</label>
      <input id="user" name="username" autocomplete="username" required autofocus spellcheck="false">
      <label for="pass">密码</label>
      <input id="pass" name="password" type="password" autocomplete="current-password" required>
      <button id="go" type="submit">登 录</button>
      <div id="err" role="alert"></div>
    </form>
    <div class="foot">本看板仅展示本人用量数据；连续失败 10 次将锁定 5 分钟。</div>
  </main>
<script>
const f = document.getElementById('f'), err = document.getElementById('err'), go = document.getElementById('go');
function show(msg) { err.textContent = msg; err.classList.add('show'); }
f.addEventListener('submit', async e => {
  e.preventDefault();
  if (go.disabled) return;
  go.disabled = true; go.textContent = '登录中…'; err.classList.remove('show');
  try {
    const r = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ user: document.getElementById('user').value, pass: document.getElementById('pass').value }),
    });
    const j = await r.json().catch(() => ({}));
    if (r.ok && j.ok) { location.href = '/'; return; }
    show(j.error || ('登录失败（HTTP ' + r.status + '）'));
  } catch { show('网络错误，请重试'); }
  go.disabled = false; go.textContent = '登 录';
});
</script>
</body>
</html>
