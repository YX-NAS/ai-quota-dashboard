<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>AI 工具额度看板</title>
<link rel="stylesheet" href="/style.css">
</head>
<body class="anim-once">
<div class="bg-aurora"></div>
<div class="bg-grid"></div>
<canvas id="fx"></canvas>
<div class="drag-ghost" id="dragGhost"></div>

<h1><span class="logo">🪐</span>AI 工具额度看板 <button id="settingsBtn" class="seg">⚙ 设置</button></h1>
<div class="sub"><span class="live-dot"></span>数据源：本机 <code>~/.zcode</code> · <code>~/.cc-switch</code> · <code>~/.workbuddy-ai</code> · <code>~/.claude</code> · 只读 · 每 60s 刷新 · <span id="updatedAt"></span> · 卡片可拖拽排序</div>

<div id="errBanner" class="err-banner" hidden>
  <span>⚠️ 看板服务未响应，数据可能已过期</span>
  <button id="retryBtn" class="seg">重试</button>
</div>

<div id="goalBanner"></div>

<div class="kpis" id="kpis"></div>
<div class="cards" id="cards"></div>

<section>
  <h2>套餐实时额度（5 小时 / 周窗口）</h2>
  <div class="cards" id="quotaCards"></div>
</section>

<section>
  <h2>模型分类费用（全部历史）
    <span class="seg"><button id="exportModelsCsv" title="导出模型费用表 CSV">导出 CSV</button></span>
  </h2>
  <div style="overflow-x:auto"><table id="modelTable"></table></div>
</section>

<section id="chart">
  <h2>每日成本趋势（近 30 天）</h2>
  <div id="chartBox"></div>
</section>

<section>
  <h2>每日明细
    <span class="seg" id="daySeg">
      <button data-d="7">7 天</button>
      <button data-d="30" class="on">30 天</button>
      <button data-d="90">90 天</button>
    </span>
    <span class="seg">
      <button id="exportDetailCsv" title="导出每日明细 CSV">导出 CSV</button>
      <button id="exportJson" title="导出整份快照 JSON">导出 JSON</button>
    </span>
  </h2>
  <div style="overflow-x:auto"><table id="detail"></table></div>
</section>

<dialog id="settingsDlg">
  <div class="dlg-head">
    <h3>额度与计价设置</h3>
    <button id="settingsX" class="dlg-x" title="关闭">✕</button>
  </div>
  <div id="settingsBody"></div>
  <div id="settingsErr" class="settings-err" hidden></div>
  <div class="btns">
    <button id="settingsCancel">取消</button>
    <button id="settingsSave" class="primary">保存</button>
  </div>
</dialog>

<script src="/app.js"></script>
</body>
</html>
