name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  node:
    name: Node ${{ matrix.node }} / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        node: [22.13.x, 24.x]
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Syntax check (node --check)
        run: |
          for f in $(git ls-files '*.js'); do
            node --check "$f"
          done
      - name: Unit tests
        run: npm test

  swift:
    name: Swift syntax (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check (swiftc -parse)
        # 两文件必须分别 parse：合编时各自的顶层表达式会互相视为重复/冲突而恒挂
        run: |
          swiftc -parse menubar/menubar.swift
          swiftc -parse desktop/desktop-widget.swift
